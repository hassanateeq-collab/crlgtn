<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype — Corporate hotel listing</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700&family=Spline+Sans+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14241F;--pine:#1D5C4D;--deep:#12443A;--sage:#EAF1ED;--paper:#F6F8F6;--brass:#A97D2B;--hair:#D9E0DA;--gold:#e8c789}
*{margin:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:14px/1.5 "Instrument Sans",sans-serif}
.top{background:#fff;border-bottom:1px solid var(--hair);padding:14px 32px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font:700 17px "Bricolage Grotesque"}
.brand i{width:6px;height:6px;border-radius:50%;background:var(--brass)}
.ctx{font-size:12px;color:#5a6b62;border-left:1px solid var(--hair);padding-left:14px}
.ctx b{color:var(--ink)}
.sort{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:#5a6b62}
.sort select{border:1px solid var(--hair);background:#fff;border-radius:10px;padding:8px 12px;font:600 12.5px "Instrument Sans";color:var(--deep)}
.wrap{display:grid;grid-template-columns:250px 1fr;gap:24px;padding:24px 32px 120px;max-width:1240px;margin:0 auto}
/* ---- filters ---- */
.side{position:sticky;top:76px;height:fit-content}
.fbox{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(20,36,31,.06);padding:16px 18px;margin-bottom:14px}
.fbox h3{font:700 10.5px "Spline Sans Mono";letter-spacing:.14em;text-transform:uppercase;color:#7a8a81;margin-bottom:10px}
.frow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;cursor:pointer}
.frow input{accent-color:var(--pine);width:15px;height:15px}
.frow .n{margin-left:auto;font:500 11px "Spline Sans Mono";color:#9aa8a0}
.tgl{display:flex;align-items:center;gap:10px;background:var(--sage);border-radius:12px;padding:11px 13px;cursor:pointer}
.tgl b{font-size:12.5px;color:var(--deep)}
.tgl .sw{margin-left:auto;width:34px;height:20px;border-radius:99px;background:#c8d5cd;position:relative;transition:.15s}
.tgl .sw:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.tgl.on .sw{background:var(--pine)}
.tgl.on .sw:after{left:16px}
.stars label{display:inline-flex;border:1px solid var(--hair);border-radius:9px;padding:6px 9px;margin:0 6px 6px 0;font-size:12px;cursor:pointer;color:#5a6b62}
.stars input{display:none}
.stars label.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.clear{font-size:11.5px;color:var(--brass);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* ---- results ---- */
.count{font-size:12.5px;color:#5a6b62;margin-bottom:12px}
.count b{color:var(--ink)}
.card{display:grid;grid-template-columns:190px 1fr 190px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(20,36,31,.06),0 8px 24px -12px rgba(20,36,31,.14);margin-bottom:14px;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 4px rgba(20,36,31,.08),0 16px 36px -12px rgba(20,36,31,.22)}
.card.sel{outline:2px solid var(--pine)}
.ph{position:relative;min-height:132px;background:var(--g,linear-gradient(135deg,#12443A,#3d7a68))}
.ph .pr{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--brass);color:#fff;display:none;align-items:center;justify-content:center;font:700 13px "Bricolage Grotesque";box-shadow:0 4px 10px rgba(20,36,31,.4)}
.card.sel .ph .pr{display:flex}
.ph .cnt{position:absolute;bottom:7px;right:8px;font:600 9px "Spline Sans Mono";background:rgba(10,25,20,.65);color:#fff;padding:3px 7px;border-radius:6px}
.mid{padding:14px 18px;min-width:0}
.nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nm h2{font:700 16.5px "Bricolage Grotesque";letter-spacing:-.01em}
.nm .st{color:var(--brass);font-size:12px;letter-spacing:1.5px}
.meta{font-size:11.5px;color:#5a6b62;margin:2px 0 7px}
.meta b{font:600 10px "Spline Sans Mono";border:1px solid var(--hair);border-radius:6px;padding:1px 5px;color:var(--deep)}
.desc{font-size:12.5px;color:#41524a;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.pill{background:var(--sage);color:var(--deep);border-radius:99px;padding:3.5px 9px;font-size:10.5px;font-weight:600}
.pill.inc{background:transparent;border:1px dashed var(--hair);color:#7a8a81;font-weight:500}
.pkgs{display:flex;gap:5px;margin-top:9px}
.pk{border:1px solid var(--hair);border-radius:8px;padding:4px 9px;font:600 10.5px "Spline Sans Mono";color:#5a6b62;cursor:pointer}
.pk.on{background:var(--deep);border-color:var(--deep);color:#fff}
.right{border-left:1px solid #f0f3f0;padding:14px 16px;display:flex;flex-direction:column;text-align:right}
.yr{font:700 8.5px "Spline Sans Mono";letter-spacing:.14em;color:var(--brass);text-transform:uppercase}
.amt{font:700 21px "Bricolage Grotesque";letter-spacing:-.02em}
.amt small{font:500 10px "Instrument Sans";color:#8a978f;display:block;margin-top:1px}
.tot{font-size:10.5px;color:#5a6b62;margin-top:5px}
.tot b{font-family:"Spline Sans Mono"}
.selbtn{margin-top:auto;border:0;border-radius:10px;background:var(--pine);color:#fff;font:700 12.5px "Instrument Sans";padding:10px 0;cursor:pointer}
.selbtn:hover{background:var(--deep)}
.card.sel .selbtn{background:#fff;color:var(--deep);border:1.5px solid var(--pine)}
/* ---- tray ---- */
.tray{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--hair);padding:12px 32px;display:none;align-items:center;gap:10px;z-index:30}
.tray.show{display:flex}
.tchip{display:flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--hair);border-radius:99px;padding:6px 12px;font-size:12px}
.tchip i{width:18px;height:18px;border-radius:50%;background:var(--pine);color:#fff;display:flex;align-items:center;justify-content:center;font:700 10px "Bricolage Grotesque";font-style:normal}
.tchip u{text-decoration:none;font:600 11px "Spline Sans Mono";color:#5a6b62}
.send{margin-left:auto;background:var(--ink);color:#fff;border:0;border-radius:12px;font:700 13.5px "Instrument Sans";padding:13px 22px;cursor:pointer}
.send small{display:block;font:500 9.5px;opacity:.7;letter-spacing:.03em}
.note{font-size:10.5px;color:#8a978f}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static}.card{grid-template-columns:120px 1fr}.right{grid-column:1/3;border-left:0;border-top:1px solid #f0f3f0;flex-direction:row;align-items:center;gap:14px}.selbtn{margin-left:auto;padding:10px 18px}}
</style></head><body>

<div class="top">
  <span class="brand"><i></i>Corlington</span>
  <span class="ctx">CF-2613-KHI · <b>Audit team — September</b> · 14–17 Sept · 3 rooms · 4 guests · 3 nights</span>
  <div class="sort">
    Sort
    <select id="sortSel">
      <option value="rec">Recommended — your rates first</option>
      <option value="lo">Price · low to high</option>
      <option value="hi">Price · high to low</option>
      <option value="st">Stars · high to low</option>
    </select>
  </div>
</div>

<div class="wrap">
  <aside class="side">
    <div class="fbox">
      <div class="tgl on" id="negTgl" onclick="this.classList.toggle('on');render()">
        <b>My negotiated rates first</b><span class="sw"></span>
      </div>
    </div>
    <div class="fbox">
      <h3>Corridor</h3>
      <div id="fCor"></div>
    </div>
    <div class="fbox">
      <h3>Stars</h3>
      <div class="stars" id="fStars"></div>
      <h3 style="margin-top:12px">Price bracket</h3>
      <div class="stars" id="fBr"></div>
    </div>
    <div class="fbox">
      <h3>Must have (verified only)</h3>
      <div id="fAm"></div>
      <div style="margin-top:8px"><span class="clear" onclick="clearAll()">Clear all filters</span></div>
    </div>
  </aside>

  <main>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </main>
</div>

<div class="tray" id="tray">
  <span style="font:700 12px 'Instrument Sans';color:#5a6b62" id="trayN"></span>
  <span id="trayChips" style="display:flex;gap:8px;flex-wrap:wrap"></span>
  <span class="note">Priority = click order · max 3</span>
  <button class="send">Send request<small>offers back in 15 minutes — never booked without you</small></button>
</div>

<script>
const CORRIDORS=["Clifton/DHA","Shahrah-e-Faisal","Airport","Saddar","SITE"];
const AMENS=["Fast wifi","Backup power","Meeting rooms","Indoor parking","Pool"];
const G=["#12443A,#3d7a68","#1D5C4D,#A97D2B","#0d332b,#48806f","#14241F,#1D5C4D","#2c5e50,#7aa393","#0f3a30,#846320","#123f35,#5b8d7d","#16473b,#2f6b5b","#0d332b,#3d7a68","#1a5044,#c19a4f"];
const H=[
 {n:"Harbourline Grand",s:5,c:"Clifton/DHA",b:"B5",d:"Waterfront flagship — business centre, three restaurants, executive lounge.",a:["Fast wifi","Backup power","Meeting rooms","Pool"],inc:"Airport transfer + lounge",p:{P1:38000,P2:42000,P3:48000},neg:null,ph:14},
 {n:"Corniche Suites",s:4,c:"Clifton/DHA",b:"B4",d:"Quiet business hotel near the seafront; rooftop pool deck, two meeting rooms.",a:["Fast wifi","Backup power","Indoor parking"],inc:"Airport pickup · late checkout",p:{P1:24000,P2:27000,P3:31000},neg:{P1:22000,P2:25000},ph:12},
 {n:"Metropole Regency",s:5,c:"Saddar",b:"B4",d:"Restored landmark on the museum quarter; grand meeting floor.",a:["Fast wifi","Meeting rooms","Indoor parking"],inc:"Breakfast lounge",p:{P1:33000,P2:36500,P3:41000},neg:null,ph:16},
 {n:"Marina Bay Suites",s:4,c:"Clifton/DHA",b:"B4",d:"Serviced suites with kitchenettes — good for week-long project teams.",a:["Fast wifi","Backup power","Indoor parking","Pool"],inc:"Laundry 24h",p:{P1:26000,P2:29000},neg:{P1:24500},ph:9},
 {n:"Faisal Court Executive",s:3,c:"Shahrah-e-Faisal",b:"B3",d:"Practical business hotel ten minutes from the airport side.",a:["Fast wifi","Backup power"],inc:"Breakfast-to-go",p:{P1:14000,P2:16000,P3:19000},neg:null,ph:8},
 {n:"Gulberg Executive",s:3,c:"Shahrah-e-Faisal",b:"B3",d:"Compact rooms, fast checkout, favoured by sales teams.",a:["Fast wifi","Backup power","Indoor parking"],inc:"Early check-in on request",p:{P1:13000,P2:15000},neg:{P1:12500},ph:7},
 {n:"Skyline Airport Hotel",s:3,c:"Airport",b:"B3",d:"Directly opposite Jinnah International arrivals — soundproofed rooms.",a:["Fast wifi","Backup power","Meeting rooms"],inc:"24h shuttle",p:{P1:15000,P2:17500},neg:null,ph:10},
 {n:"Airside Transit Lodge",s:2,c:"Airport",b:"B1",d:"No-frills overnight layovers, five minutes from the terminal.",a:["Backup power"],inc:"",p:{P1:8000,P2:9500},neg:null,ph:5},
 {n:"Cantt Residency",s:3,c:"Saddar",b:"B2",d:"Guesthouse comfort beside the Cantt station; secure courtyard parking.",a:["Fast wifi","Indoor parking"],inc:"Home-style dinner",p:{P1:12000,P2:13500},neg:null,ph:6},
 {n:"SITE Business Inn",s:3,c:"SITE",b:"B2",d:"The only vetted option inside the industrial area — site-visit friendly.",a:["Fast wifi","Backup power","Indoor parking"],inc:"Packed lunches",p:{P1:11000,P2:12500},neg:{P1:10500},ph:6},
];
const NIGHTS=3, ROOMS=3;
let sel=[], pkgSel={};
const state={cor:new Set(),st:new Set(),br:new Set(),am:new Set()};

function chipFilter(el,arr,set,kind){
  el.innerHTML=arr.map(v=>`<label class="frow"><input type="checkbox" onchange="tog('${kind}','${v}')"> ${v}<span class="n">${H.filter(h=>kind==='cor'?h.c===v:h.a.includes(v)).length}</span></label>`).join("");
}
function btnFilter(el,arr,kind,fmt){
  el.innerHTML=arr.map(v=>`<label id="${kind}${v}" onclick="tog('${kind}','${v}');this.classList.toggle('on')">${fmt(v)}<input type="checkbox"></label>`).join("");
}
function tog(k,v){const s=state[k]; s.has(String(v))?s.delete(String(v)):s.add(String(v)); render();}
function clearAll(){for(const k in state)state[k].clear();document.querySelectorAll('.frow input').forEach(i=>i.checked=false);document.querySelectorAll('.stars label').forEach(l=>l.classList.remove('on'));render();}

function price(h){const pk=pkgSel[h.n]||Object.keys(h.p)[0];const base=h.p[pk];const neg=h.neg&&h.neg[pk];return{pk,rate:neg??base,isNeg:!!neg};}

function render(){
  const negFirst=document.getElementById('negTgl').classList.contains('on');
  let rows=H.filter(h=>
    (!state.cor.size||state.cor.has(h.c))&&
    (!state.st.size||state.st.has(String(h.s)))&&
    (!state.br.size||state.br.has(h.b))&&
    ([...state.am].every(a=>h.a.includes(a)))
  );
  const sort=document.getElementById('sortSel').value;
  rows.sort((x,y)=>{
    const px=price(x),py=price(y);
    if(sort==='lo')return px.rate-py.rate;
    if(sort==='hi')return py.rate-px.rate;
    if(sort==='st')return y.s-x.s||px.rate-py.rate;
    if(negFirst&&(!!y.neg-!!x.neg))return !!y.neg-!!x.neg;
    return y.s-x.s||px.rate-py.rate;
  });
  document.getElementById('count').innerHTML=`<b>${rows.length} hotels</b> match this file — rates are your company's contracted card, per room per night`;
  document.getElementById('list').innerHTML=rows.map((h,i)=>{
    const {pk,rate,isNeg}=price(h);
    const si=sel.indexOf(h.n);
    return `<article class="card${si>-1?' sel':''}" style="--g:linear-gradient(135deg,${G[H.indexOf(h)]})">
      <div class="ph"><span class="pr">${si+1||''}</span><span class="cnt">${h.ph} PHOTOS</span></div>
      <div class="mid">
        <div class="nm"><h2>${h.n}</h2><span class="st">${'★'.repeat(h.s)}</span></div>
        <div class="meta">${h.c} · <b>${h.b}</b>${h.inc?` · incl. ${h.inc}`:''}</div>
        <div class="desc">${h.d}</div>
        <div class="pills">${h.a.map(a=>`<span class="pill">✓ ${a}</span>`).join('')}</div>
        <div class="pkgs">${Object.keys(h.p).map(p=>`<span class="pk${p===pk?' on':''}" onclick="pkgSel['${h.n}']='${p}';render()">${p} · ${(h.neg&&h.neg[p]?h.neg[p]:h.p[p])/1000}k</span>`).join('')}</div>
      </div>
      <div class="right">
        ${isNeg?'<span class="yr">Your rate</span>':'<span class="yr" style="color:#9aa8a0">Card rate</span>'}
        <div class="amt">PKR ${rate.toLocaleString()}<small>per room / night · ${pk}</small></div>
        <div class="tot">3 rooms × 3 nights ≈ <b>${(rate*NIGHTS*ROOMS).toLocaleString()}</b></div>
        <button class="selbtn" onclick="pick('${h.n}')">${si>-1?`Selected · priority ${si+1}`:'Select'}</button>
      </div>
    </article>`;
  }).join('');
  const tray=document.getElementById('tray');
  tray.classList.toggle('show',sel.length>0);
  document.getElementById('trayN').textContent=`${sel.length}/3 selected`;
  document.getElementById('trayChips').innerHTML=sel.map((n,i)=>{
    const h=H.find(x=>x.n===n);const {pk,rate}=price(h);
    return `<span class="tchip"><i>${i+1}</i>${n}<u>${pk} · ${rate.toLocaleString()}</u><span style="cursor:pointer;color:#9aa8a0" onclick="pick('${n}')">✕</span></span>`;
  }).join('');
}
function pick(n){
  const i=sel.indexOf(n);
  if(i>-1)sel.splice(i,1);
  else if(sel.length>=3){alert('A request goes to at most 3 hotels — that keeps every offer a serious one. Deselect one to swap.');return;}
  else sel.push(n);
  render();
}
chipFilter(document.getElementById('fCor'),CORRIDORS,state.cor,'cor');
chipFilter(document.getElementById('fAm'),AMENS,state.am,'am');
btnFilter(document.getElementById('fStars'),[5,4,3,2],'st',v=>'★'.repeat(v));
btnFilter(document.getElementById('fBr'),["B1","B2","B3","B4","B5"],'br',v=>v);
document.getElementById('sortSel').onchange=render;
render();
</script>
</body></html>
